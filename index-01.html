<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>หารค่าใช้จ่าย — Huahin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;900&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f13; --surface: #1a1a22; --card: #22222e; --border: #2e2e3e;
    --accent: #f0c040; --accent-dim: #f0c04022; --text: #f0ede8;
    --muted: #8b8a9b; --green: #4ade80; --red: #f87171; --blue: #60a5fa;
  }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', 'Noto Sans Thai', sans-serif; min-height: 100vh; }
  #app { max-width: 520px; margin: 0 auto; padding-bottom: 80px; }

  /* Header */
  .header { padding: 28px 20px 16px; border-bottom: 1px solid var(--border); }
  .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .header-label { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
  .header-title { font-size: 24px; font-weight: 900; letter-spacing: -0.5px; }
  .header-total-label { font-size: 11px; color: var(--muted); margin-bottom: 2px; text-align: right; }
  .header-total { font-size: 22px; font-weight: 900; color: var(--accent); text-align: right; }
  .header-avg { font-size: 11px; color: var(--muted); text-align: right; }
  .member-pills { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .pill { display: flex; align-items: center; gap: 5px; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px 3px 5px; }
  .pill span { font-size: 12px; font-weight: 600; }

  /* Tabs */
  .tab-bar { display: flex; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 10; }
  .tab-btn { flex: 1; padding: 13px 0; background: none; border: none; color: var(--muted); font-weight: 500; font-size: 12px; cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; letter-spacing: 0.3px; font-family: inherit; }
  .tab-btn.active { color: var(--accent); font-weight: 800; border-bottom-color: var(--accent); }

  /* Content */
  .content { padding: 16px 16px 0; }
  .tab-panel { display: none; } .tab-panel.active { display: block; }

  /* Card */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 10px; }

  /* Avatar */
  .avatar { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; flex-shrink: 0; letter-spacing: 0.5px; }

  /* Tag */
  .tag { border-radius: 4px; padding: 1px 7px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }

  /* Form */
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .field label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .field input { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 9px 12px; font-size: 14px; outline: none; transition: border-color .15s; font-family: inherit; }
  .field input:focus { border-color: var(--accent); }

  /* Buttons */
  .btn { border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .15s; letter-spacing: 0.3px; font-family: inherit; }
  .btn:hover { opacity: 0.82; }
  .btn-primary { background: var(--accent); color: #0f0f13; border: none; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-danger { background: #f8717122; color: var(--red); border: 1px solid #f8717144; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-full { width: 100%; }

  /* Payer / participant selector */
  .selector-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .sel-btn { display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 6px; border-radius: 20px; border: 2px solid var(--border); background: var(--surface); cursor: pointer; transition: all .15s; font-family: inherit; color: var(--text); font-size: 13px; font-weight: 600; }
  .sel-btn.selected-accent { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }
  .sel-btn.selected-green { border-color: var(--green); background: #4ade8022; color: var(--green); }

  /* Expense row */
  .exp-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .exp-info { display: flex; gap: 10px; align-items: center; flex: 1; min-width: 0; }
  .exp-name { font-weight: 700; font-size: 14px; }
  .exp-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .exp-tags { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
  .exp-amount { font-weight: 900; font-size: 16px; color: var(--accent); text-align: right; flex-shrink: 0; }
  .exp-share { font-size: 10px; color: var(--muted); margin-top: 2px; }

  /* Settle */
  .settle-row { display: flex; align-items: center; gap: 10px; }
  .balance-right { text-align: right; }
  .balance-amount { font-weight: 900; font-size: 16px; }

  /* Toast */
  #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 700; z-index: 999; box-shadow: 0 4px 20px #0008; display: none; color: #fff; white-space: nowrap; }

  /* Loading */
  #loading { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; z-index: 100; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 14px; line-height: 2; }
  .warning-box { background: var(--accent-dim); border: 1px solid #f0c04044; border-radius: 10px; padding: 14px; font-size: 13px; color: var(--accent); margin-bottom: 14px; }
  .section-label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
  .row-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div style="color:var(--muted);font-size:13px;">กำลังโหลด...</div>
</div>

<div id="app" style="display:none">
  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div>
        <div class="header-label">Expense Tracker</div>
        <div class="header-title">หารค่าใช้จ่าย</div>
      </div>
      <div>
        <div class="header-total-label">ยอดรวมทั้งหมด</div>
        <div class="header-total" id="totalAmount">฿0</div>
        <div class="header-avg" id="avgAmount"></div>
      </div>
    </div>
    <div class="member-pills" id="memberPills"></div>
  </div>

  <!-- Tabs -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('expenses')">📋 รายการ</button>
    <button class="tab-btn" onclick="switchTab('add')">➕ เพิ่ม</button>
    <button class="tab-btn" onclick="switchTab('settle')">💸 หาร</button>
    <button class="tab-btn" onclick="switchTab('members')">👥 สมาชิก</button>
  </div>

  <div class="content">

    <!-- EXPENSES -->
    <div id="tab-expenses" class="tab-panel active">
      <div id="expenseList"></div>
    </div>

    <!-- ADD -->
    <div id="tab-add" class="tab-panel">
      <div id="addWarning" class="warning-box" style="display:none">⚠️ กรุณาเพิ่มสมาชิกก่อนที่แท็บ 👥</div>
      <div class="field">
        <label>วันที่</label>
        <input type="date" id="fDate" />
      </div>
      <div class="field">
        <label>ใครจ่าย</label>
        <div class="selector-row" id="payerRow"></div>
      </div>
      <div class="field">
        <label>จำนวนเงิน (บาท)</label>
        <input type="number" id="fAmount" placeholder="0" />
      </div>
      <div class="field">
        <label>รายละเอียด</label>
        <input type="text" id="fDesc" placeholder="ค่าอาหาร, ค่า Grab..." />
      </div>
      <div class="field">
        <div class="row-between">
          <label style="margin:0">ใครร่วมหาร</label>
          <button class="btn btn-ghost btn-sm" onclick="toggleAllParticipants()">เลือกทั้งหมด</button>
        </div>
        <div class="selector-row" id="participantRow"></div>
      </div>
      <button class="btn btn-primary btn-full" onclick="addExpense()">➕ เพิ่มรายการ</button>
    </div>

    <!-- SETTLE -->
    <div id="tab-settle" class="tab-panel">
      <div class="section-label">ยอดดุลแต่ละคน</div>
      <div id="balanceList"></div>
      <div class="section-label" style="margin-top:16px">วิธีหารให้จบ</div>
      <div id="settlementList"></div>
    </div>

    <!-- MEMBERS -->
    <div id="tab-members" class="tab-panel">
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <input type="text" id="newMemberInput" placeholder="ชื่อสมาชิก..." style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 12px;font-size:14px;outline:none;font-family:inherit" onkeydown="if(event.key==='Enter')addMember()" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'" />
        <button class="btn btn-primary" onclick="addMember()">เพิ่ม</button>
      </div>
      <div id="memberList"></div>
    </div>

  </div>
</div>

<div id="toast"></div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, addDoc, getDocs, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA_C8PpUQolCV7RwP3WeVjIIAHCpJBHFKs",
  authDomain: "huahin-budget.firebaseapp.com",
  projectId: "huahin-budget",
  storageBucket: "huahin-budget.firebasestorage.app",
  messagingSenderId: "1000653940306",
  appId: "1:1000653940306:web:9e8817d570e2b2cc964c97",
  measurementId: "G-CY49GD7QBZ"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ── State ──────────────────────────────────────────────────────────────────
let members = [];
let expenses = [];
let selectedPayer = "";
let selectedParticipants = [];

// ── Helpers ────────────────────────────────────────────────────────────────
const fmt = n => new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',maximumFractionDigits:0}).format(n);
const today = () => new Date().toISOString().split('T')[0];

function avatar(name, size=32) {
  const initials = name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
  const hue = [...name].reduce((a,c)=>a+c.charCodeAt(0),0) % 360;
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:hsl(${hue},55%,42%);font-size:${size*.38}px">${initials}</div>`;
}

function showToast(msg, color='var(--green)') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = color; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2200);
}

window.switchTab = function(id) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  document.querySelectorAll('.tab-btn')[['expenses','add','settle','members'].indexOf(id)].classList.add('active');
  if (id === 'add') renderAddForm();
  if (id === 'settle') renderSettle();
  if (id === 'members') renderMembers();
};

// ── Render ─────────────────────────────────────────────────────────────────
function renderAll() {
  renderHeader();
  renderExpenses();
  renderAddForm();
  renderSettle();
  renderMembers();
}

function renderHeader() {
  const total = expenses.reduce((s,e)=>s+e.amount,0);
  document.getElementById('totalAmount').textContent = fmt(total);
  document.getElementById('avgAmount').textContent = members.length ? `เฉลี่ยคนละ ${fmt(total/members.length)}` : '';
  document.getElementById('memberPills').innerHTML = members.map(m =>
    `<div class="pill">${avatar(m,20)}<span>${m}</span></div>`
  ).join('');
}

function renderExpenses() {
  const el = document.getElementById('expenseList');
  if (!expenses.length) {
    el.innerHTML = `<div class="empty">ยังไม่มีรายการ<br><span style="font-size:12px">กด ➕ เพิ่ม เพื่อบันทึกค่าใช้จ่าย</span></div>`;
    return;
  }
  el.innerHTML = [...expenses].reverse().map(exp => `
    <div class="card">
      <div class="exp-row">
        <div class="exp-info">
          ${avatar(exp.payer, 36)}
          <div style="min-width:0">
            <div class="exp-name">${exp.description || '(ไม่มีรายละเอียด)'}</div>
            <div class="exp-sub">${exp.payer} จ่าย · ${exp.date}</div>
            <div class="exp-tags">
              ${exp.participants.map(p=>`<span class="tag" style="background:var(--blue)22;color:var(--blue);border:1px solid #60a5fa44">${p}</span>`).join('')}
            </div>
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div class="exp-amount">${fmt(exp.amount)}</div>
          <div class="exp-share">÷${exp.participants.length} = ${fmt(exp.amount/exp.participants.length)}/คน</div>
          <button class="btn btn-danger btn-sm" style="margin-top:6px" onclick="deleteExpense('${exp.id}')">ลบ</button>
        </div>
      </div>
    </div>
  `).join('');
}

function renderAddForm() {
  const warn = document.getElementById('addWarning');
  warn.style.display = members.length === 0 ? 'block' : 'none';
  // payer
  document.getElementById('payerRow').innerHTML = members.map(m => `
    <button class="sel-btn ${selectedPayer===m?'selected-accent':''}" onclick="selectPayer('${m}')">
      ${avatar(m,24)}<span>${m}</span>
    </button>
  `).join('');
  // participants
  document.getElementById('participantRow').innerHTML = members.map(m => {
    const sel = selectedParticipants.includes(m);
    return `
      <button class="sel-btn ${sel?'selected-green':''}" onclick="toggleParticipant('${m}')">
        ${avatar(m,24)}<span>${m}</span>${sel?'<span style="font-size:11px;color:var(--green)">✓</span>':''}
      </button>
    `;
  }).join('');
  // default date
  if (!document.getElementById('fDate').value) document.getElementById('fDate').value = today();
}

function renderSettle() {
  const balance = {};
  members.forEach(m => balance[m] = 0);
  expenses.forEach(({payer, amount, participants}) => {
    if (!participants.length) return;
    const share = amount / participants.length;
    participants.forEach(p => { if (balance[p]!==undefined) balance[p] -= share; });
    if (balance[payer]!==undefined) balance[payer] += amount;
  });

  // balance list
  document.getElementById('balanceList').innerHTML = members.length === 0
    ? `<div style="color:var(--muted);font-size:13px">ยังไม่มีสมาชิก</div>`
    : members.map(m => {
        const bal = balance[m]||0;
        const color = bal >= 0 ? 'var(--green)' : 'var(--red)';
        const label = bal >= 0 ? 'ได้รับ' : 'ต้องจ่าย';
        const paid = expenses.filter(e=>e.payer===m).reduce((s,e)=>s+e.amount,0);
        return `
          <div class="card settle-row">
            ${avatar(m,38)}
            <div style="flex:1">
              <div style="font-weight:700">${m}</div>
              <div style="font-size:12px;color:var(--muted)">จ่ายไปแล้ว ${fmt(paid)}</div>
            </div>
            <div class="balance-right">
              <div class="balance-amount" style="color:${color}">${bal>=0?'+':''}${fmt(bal)}</div>
              <span class="tag" style="background:${color}22;color:${color};border:1px solid ${color}44">${label}</span>
            </div>
          </div>
        `;
      }).join('');

  // settlement txns
  const pos = Object.entries(balance).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([n,v])=>[n,v]);
  const neg = Object.entries(balance).filter(([,v])=>v<0).sort((a,b)=>a[1]-b[1]).map(([n,v])=>[n,-v]);
  const txns = [];
  let i=0, j=0;
  while(i<pos.length && j<neg.length) {
    const amt = Math.min(pos[i][1], neg[j][1]);
    if (amt > 0.5) txns.push({from:neg[j][0], to:pos[i][0], amount:Math.round(amt)});
    pos[i][1]-=amt; neg[j][1]-=amt;
    if(pos[i][1]<0.5) i++; if(neg[j][1]<0.5) j++;
  }

  document.getElementById('settlementList').innerHTML = txns.length === 0
    ? `<div class="card" style="color:var(--muted);font-size:13px;text-align:center">${members.length===0?'ยังไม่มีสมาชิก':'✅ ทุกคนเท่ากัน ไม่ต้องโอนอะไร'}</div>`
    : txns.map(t => `
        <div class="card settle-row">
          ${avatar(t.from,32)}
          <div style="flex:1;font-size:14px">
            <strong>${t.from}</strong>
            <span style="color:var(--muted);margin:0 6px">โอนให้</span>
            <strong>${t.to}</strong>
          </div>
          <div style="font-weight:900;font-size:16px;color:var(--accent)">${fmt(t.amount)}</div>
          ${avatar(t.to,32)}
        </div>
      `).join('');
}

function renderMembers() {
  document.getElementById('memberList').innerHTML = members.length === 0
    ? `<div class="empty">ยังไม่มีสมาชิก<br>เพิ่มชื่อเพื่อเริ่มต้น</div>`
    : members.map(m => {
        const count = expenses.filter(e=>e.participants.includes(m)).length;
        return `
          <div class="card settle-row">
            ${avatar(m,38)}
            <div style="flex:1">
              <div style="font-weight:700">${m}</div>
              <div style="font-size:12px;color:var(--muted)">${count} รายการ</div>
            </div>
            <button class="btn btn-danger btn-sm" onclick="removeMember('${m}')">ลบ</button>
          </div>
        `;
      }).join('');
}

// ── Actions ────────────────────────────────────────────────────────────────
window.selectPayer = function(name) {
  selectedPayer = name;
  renderAddForm();
};

window.toggleParticipant = function(name) {
  selectedParticipants = selectedParticipants.includes(name)
    ? selectedParticipants.filter(p=>p!==name)
    : [...selectedParticipants, name];
  renderAddForm();
};

window.toggleAllParticipants = function() {
  selectedParticipants = selectedParticipants.length === members.length ? [] : [...members];
  renderAddForm();
};

window.addExpense = async function() {
  const date = document.getElementById('fDate').value;
  const amount = parseFloat(document.getElementById('fAmount').value);
  const description = document.getElementById('fDesc').value.trim();
  if (!selectedPayer || !amount || selectedParticipants.length === 0) {
    showToast('กรุณากรอกข้อมูลให้ครบ', 'var(--red)'); return;
  }
  await addDoc(collection(db,'expenses'), {
    date, payer: selectedPayer, amount, description,
    participants: selectedParticipants, createdAt: Date.now()
  });
  document.getElementById('fAmount').value = '';
  document.getElementById('fDesc').value = '';
  selectedPayer = ''; selectedParticipants = [];
  showToast('เพิ่มรายการแล้ว ✓');
  switchTab('expenses');
};

window.deleteExpense = async function(id) {
  if (!confirm('ลบรายการนี้?')) return;
  await deleteDoc(doc(db,'expenses',id));
  showToast('ลบรายการแล้ว', 'var(--muted)');
};

window.addMember = async function() {
  const name = document.getElementById('newMemberInput').value.trim();
  if (!name || members.includes(name)) return;
  await addDoc(collection(db,'members'), { name, createdAt: Date.now() });
  document.getElementById('newMemberInput').value = '';
  showToast(`เพิ่ม ${name} แล้ว ✓`);
};

window.removeMember = async function(name) {
  if (!confirm(`ลบ ${nam
